spring:
  application:
    name: movie-booking
#  profiles:
#    active: prod

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/movie_booking_db
    username: movie_db
    password: qwer1234

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  issuer: movie-booking-api
  access-token-expiration: 3600
  refresh-token-expiration: 7776000

bakong:
  base-url: https://api-bakong.nbc.gov.kh
  token: ${BAKONG_TOKEN}
  account-id: ${BAKONG_ACCOUNT_ID}
  account-name: ${BAKONG_ACCOUNT_NAME}
  currency: USD

springdoc:
  swagger-ui:
    path: /docs

